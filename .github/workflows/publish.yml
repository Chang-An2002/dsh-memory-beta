# 打 tag 自动发布到 npm。
#
# 用的是 npm 的 trusted publishing（OIDC）：没有长期 token、不需要 OTP，
# 由 GitHub Actions 的身份直接换取发布权限，并附带 provenance 签名。
#
# 前提（只需配一次，在 npm 包页上做）：
#   Settings → Trusted Publisher → GitHub Actions
#     Organization / User : Chang-An2002
#     Repository          : dsh-memory-beta
#     Workflow filename   : publish.yml
#     Environment         : 留空
#   并勾选 **Allow npm publish**（不勾只会走暂存，需要人工去 npm 上点批准）。
#
# ⚠️ 第一个版本发不出去：trusted publisher 要在"包页面"上配置，而包还不存在时没有那个页面。
#    所以 1.0.0 请先手动 `npm publish` 建出包，再来配这个连接；之后都用 tag。
#
# 发版：git tag v1.0.1 && git push --tags
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # OIDC：trusted publishing 与 provenance 都需要它

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      # 两道闸门：测试不过、打包内容不对，都不发。
      # 手动发布时人可能忘了跑，这里不会。
      - name: 运行测试
        run: npm test

      - name: 校验打包内容
        run: node scripts/check-pack.mjs

      - name: 校验 tag 与 package.json 版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "tag 是 $tag，但 package.json 的 version 是 $version" >&2
            exit 1
          fi

      # Trusted publishing（OIDC）需要 npm 11.5.1 或更新。
      # setup-node 自带的 npm 版本随 Node 走，不保证够新，所以显式升一次。
      - name: 升级 npm
        run: npm install --global npm@latest

      # 幂等：版本已经在 npm 上就跳过发布。
      # 没有这一步时，给一个已发布的版本补打 tag（很常见）会让整条流水线变红。
      - name: 该版本是否已发布
        id: exists
        run: |
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-memory-beta@${version}" version >/dev/null 2>&1; then
            echo "dsh-memory-beta@${version} 已在 npm 上，跳过发布。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 预发布版本（1.1.0-beta.1 这类）不要顶掉 latest。
      # `npm publish` 不带 --tag 时总把新版本标成 latest，于是 `npm i pkg` 会装到 beta，
      # 而发布者往往没意识到。含 `-` 的版本一律发到 dist-tag `next`。
      - name: 决定 dist-tag
        id: disttag
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT"; echo "$version 是预发布版本，发到 dist-tag next（不顶掉 latest）。" ;;
            *)   echo "tag=latest" >> "$GITHUB_OUTPUT"; echo "$version 是正式版本，发到 dist-tag latest。" ;;
          esac

      - name: 发布到 npm
        if: steps.exists.outputs.skip != 'true'
        run: npm publish --provenance --access public --tag ${{ steps.disttag.outputs.tag }}

      # `npm publish` 返回 0 不等于"别人能装到"，两种常见情况：
      #   a) 注册表传播延迟 —— 发布成功后几十秒内 `npm view` 仍可能 404；
      #   b) 包设置要求人工批准 —— 版本进暂存队列，命令照样成功退出。
      # 两种都表现为"流水线绿、注册表查不到"，所以发布后必须自己核一遍。
      # 等待窗口给到 120 秒：为传播延迟留够余量，又不会在真进了暂存队列时无限等。
      - name: 确认版本真的可以安装
        if: steps.exists.outputs.skip != 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          for _ in $(seq 1 24); do
            if npm view "dsh-memory-beta@${version}" version >/dev/null 2>&1; then
              echo "dsh-memory-beta@${version} 已可安装。"
              exit 0
            fi
            sleep 5
          done
          echo "::error::发布命令成功了，但 dsh-memory-beta@${version} 在两分钟内查不到。"
          echo "先重试一次（可能是传播延迟）；仍查不到就去 npm 包页面看是否进了暂存队列、等人工批准。"
          exit 1
